name: Daily Meme

on:
  schedule:
    - cron: '15 10 * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: 'Run mode for the daily meme rotation'
        required: false
        default: production
        type: choice
        options:
          - production
          - test

permissions:
  contents: write

jobs:
  daily-meme:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run daily meme rotation
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "schedule" ]; then
            MODE="production"
          else
            MODE="${{ github.event.inputs.mode }}"
            if [ -z "$MODE" ]; then
              MODE="production"
            fi
          fi
          echo "Running in $MODE mode"
          python scripts/rotate_daily.py --mode "$MODE"

      - name: Commit generated files
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if [ -z "$(git status --porcelain -- assets/daily.gif data/current.json)" ]; then
            echo "No daily meme changes to commit."
            exit 0
          fi

          git add assets/daily.gif data/current.json
          git commit -m "Rotate daily meme"
